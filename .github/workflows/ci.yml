name: Quality checks
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
    inputs:
      pages:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          GITHUB_PAGES: ${{ inputs.pages && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: out
          include-hidden-files: true
  browsers:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: out
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
        env:
          PHOTONIC_BASE_PATH: ${{ inputs.pages && '/Photonic' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
